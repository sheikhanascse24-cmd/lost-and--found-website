<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lost & Found</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>🔍 Lost & Found</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse Items</a></li>
                <li id="nav-auth">
                    <a href="dashboard.html" class="active">Dashboard</a> | <a href="#" onclick="logout()">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <section class="dashboard-section">
        <div class="container">
            <div class="dashboard-header">
                <h1>Welcome, <span id="user-name"></span></h1>
                <a href="post-item.html" class="btn btn-primary">Post New Item</a>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h2>Your Profile</h2>
                        <a href="edit-profile.html" class="btn btn-primary btn-small">✏️ Edit Profile</a>
                    </div>
                    <div id="profile-info" class="profile-info">
                        <p>Loading profile...</p>
                    </div>
                </div>

                <div class="dashboard-panel">
                    <h2>Your Posted Items</h2>
                    <div id="posted-items" class="items-list">
                        <p>Loading items...</p>
                    </div>
                </div>

                <div class="dashboard-panel">
                    <h2>Messages</h2>
                    <div id="messages-list" class="messages-list">
                        <p>Loading messages...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Lost & Found. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
